# When a pull request is merged into main, this updates Supabase to match:
#   1. new database changes in supabase/migrations/ run on the live
#      project, in order, each once (no more pasting into the SQL Editor);
#   2. the server functions that changed are deployed (no more pasting
#      into Edge Functions), each keeping its Verify JWT setting from
#      supabase/config.toml.
# Needs two repository secrets (Settings -> Secrets and variables ->
# Actions): SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD. Until both are
# there it skips with a note. Can also be run by hand from the Actions tab.
name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ifiqjixvvexaiooozjaa
    steps:
      - name: Check the secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Skipped: add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository secrets to turn on automatic deploys."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'yes'
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'yes'
        with:
          version: 2.122.1
      - name: Connect to the project
        if: steps.secrets.outputs.ready == 'yes'
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Database changes
        if: steps.secrets.outputs.ready == 'yes'
        run: bash supabase/deploy/migrate.sh
      - name: Server functions
        if: steps.secrets.outputs.ready == 'yes'
        run: bash supabase/deploy/functions.sh "${{ github.event_name == 'push' && github.event.before || '' }}"
